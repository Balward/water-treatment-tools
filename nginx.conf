events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # One-time HTML migration: clear only HTTP caches, never cookies or storage.
    map $arg_repair $operations_cache_repair {
        default "";
        "cache-20261021" '"cache"';
    }
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # Main dashboard route
        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Clear-Site-Data $operations_cache_repair always;
            try_files /apps/dashboard/dashboard.html =404;
        }

        # Dashboard routes
        location /dashboard/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            alias /usr/share/nginx/html/apps/dashboard/;
            try_files $uri $uri/ /apps/dashboard/dashboard.html;

            location ~* \.(js|css)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        location = /apps/dashboard/dashboard.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Clear-Site-Data $operations_cache_repair always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Clear-Site-Data $operations_cache_repair always;
            try_files /apps/dashboard/dashboard.html =404;
        }

        # Shared UI files and the new home bundle revalidate between releases.
        # Exact HTML locations above keep their stronger no-store policy.
        location ^~ /shared/operations/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ^~ /apps/dashboard/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Compatibility for browsers still holding the pre-migration HTML.
        location = /dashboard.css {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files /apps/dashboard/dashboard.css =404;
        }

        # Favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            add_header Content-Type "image/x-icon";
            return 200 "";
        }
        
        # RoboJar Analyzer routes
        location ^~ /robojar-analyzer/ {
            alias /usr/share/nginx/html/apps/robojar-analyzer/;
            try_files $uri $uri/ /apps/robojar-analyzer/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Dose Predictor routes
        location ^~ /dose-predictor/ {
            alias /usr/share/nginx/html/apps/dose-predictor/;
            try_files $uri $uri/ /apps/dose-predictor/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Detention Time (Plant Flow) routes
        location ^~ /plant-flow/ {
            alias /usr/share/nginx/html/apps/plant-flow/;
            try_files $uri $uri/ /apps/plant-flow/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Alum Hydrometer Conversion routes
        location /alum-hydrometer-conversion/ {
            alias /usr/share/nginx/html/apps/alum-hydrometer-conversion/;
            try_files $uri $uri/ /apps/alum-hydrometer-conversion/index.html;

            location ~* \.(js|css|html)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        

        # Stream MWAT Calculator routes
        location /mwat-calculator/ {
            alias /usr/share/nginx/html/apps/mwat-calculator/;
            try_files $uri $uri/ /apps/mwat-calculator/index.html;

            location ~* \.(js|css|html)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # Regulation 100 Study Guide routes
        location ^~ /regulation-100-study/ {
            alias /usr/share/nginx/html/apps/regulation-100-study/;
            try_files $uri $uri/ /apps/regulation-100-study/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Water Treatment Flashcards routes
        location ^~ /water-treatment-flashcards/ {
            alias /usr/share/nginx/html/apps/water-treatment-flashcards/;
            try_files $uri $uri/ /apps/water-treatment-flashcards/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Sodium Hypochlorite Calculator routes
        location ^~ /sodium-hypochlorite-calculator/ {
            alias /usr/share/nginx/html/apps/sodium-hypochlorite-calculator/;
            try_files $uri $uri/ /apps/sodium-hypochlorite-calculator/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Water Data Explorer routes
        location ^~ /water-data-explorer/ {
            alias /usr/share/nginx/html/apps/water-data-explorer/;
            try_files $uri $uri/ /apps/water-data-explorer/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Live Operations Dashboard routes
        location ^~ /live-operations-dashboard/ {
            alias /usr/share/nginx/html/apps/live-operations-dashboard/;
            try_files $uri $uri/ /apps/live-operations-dashboard/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Also revalidate direct app URLs and internal index fallbacks.
        location ^~ /apps/live-operations-dashboard/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ =404;
        }

        # NH3 Loading Insight routes
        location /nh3-loading/ {
            alias /usr/share/nginx/html/apps/nh4-loading/;
            try_files $uri $uri/ /apps/nh4-loading/index.html;
            
            location ~* \.(js|css|html)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # Legacy NH4 Loading redirect
        location = /nh4-loading/ {
            return 301 /nh3-loading/;
        }

        location ~ ^/nh4-loading/(.*)$ {
            return 301 /nh3-loading/$1;
        }

        # Video Tutorials routes
        location ^~ /video-tutorials/ {
            alias /usr/share/nginx/html/apps/video-tutorials/;
            try_files $uri $uri/ /apps/video-tutorials/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Videos folder for tutorial content
        location /Videos/ {
            alias /usr/share/nginx/html/Videos/;
            try_files $uri =404;
            expires 1d;
            add_header Cache-Control "public, immutable";
            
            # Video-specific MIME types
            location ~* \.(mp4)$ {
                add_header Content-Type "video/mp4";
            }
            location ~* \.(webm)$ {
                add_header Content-Type "video/webm";
            }
            location ~* \.(ogv)$ {
                add_header Content-Type "video/ogg";
            }
        }

        # All Application Review routes, including alternate static URLs, go
        # through the server's access check before any content is released.
        location = /application-review { return 302 /application-review/; }
        location = /apps/application-review { return 302 /application-review/; }
        # This longer prefix must outrank /apps/' nested static-file regex.
        location ^~ /apps/application-review/ {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Cache-Control "no-store, private" always;
        }
        location ~ ^/(application-review(?:/|$)|apps/application-review/|application-review-access(?:/|$)|api/application-review(?:/|$)) {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Cache-Control "no-store, private" always;
        }
        location = /plant-rounds { return 301 /plant-rounds/; }
        location = /sop-creator { return 301 /sop-creator/; }
        location ^~ /sop-creator/ {
            alias /usr/share/nginx/html/apps/sop-creator/;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        location = /operations-management { return 301 /operations-management/; }
        location ^~ /operations-management/ {
            alias /usr/share/nginx/html/apps/operations-management/;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        location ^~ /plant-rounds/ {
            alias /usr/share/nginx/html/apps/plant-rounds/;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # All apps routes
        location /apps/ {
            try_files $uri $uri/ =404;
            
            location ~* \.(js|css|html)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # Assets routes (logos, fonts)
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
            
            # Handle font MIME types
            location ~* \.(otf)$ {
                add_header Content-Type "font/otf";
            }
            location ~* \.(woff2)$ {
                add_header Content-Type "font/woff2";
            }
            location ~* \.(woff)$ {
                add_header Content-Type "font/woff";
            }
            location ~* \.(ttf)$ {
                add_header Content-Type "font/ttf";
            }
            
            # Handle image MIME types
            location ~* \.(png|jpg|jpeg|gif|svg)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # Sample data files (optional, you might want to restrict this)
        location /sample-data/ {
            try_files $uri =404;
            expires 1h;
        }

        # Static assets caching
        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Handle 404s
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # SSE stream for live operations updates
        location = /api/live-ops/stream {
            proxy_pass http://localhost:3001/api/live-ops/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no;
        }

        # API proxy to Node.js server
        location ^~ /api/sops {
            client_max_body_size 16m;
            proxy_pass http://localhost:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            proxy_pass http://localhost:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
