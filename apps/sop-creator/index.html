<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOP Library | Northglenn Operations</title>
  <script>
    const destination=new URL('./library.html',location.href),query=new URLSearchParams(location.search);
    // Preserve existing bookmarks that open an SOP or start a new document.
    if(query.has('sop')||query.get('new')==='1')destination.pathname=destination.pathname.replace(/library\.html$/,'editor.html');
    destination.search=location.search;
    location.replace(destination.href);
  </script>
</head>
<body><p><a href="./library.html">Open SOP Library</a></p></body>
</html>
