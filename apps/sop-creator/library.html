<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOP Library | Northglenn Operations</title>
  <link rel="icon" href="../../assets/logos/favicon.png">
  <link rel="stylesheet" href="../../shared/operations/theme.css"><link rel="stylesheet" href="../../shared/operations/navigation.css">
  <link rel="stylesheet" href="styles.css?v=20261106-delete1">
  <script src="../../shared/operations/navigation.js?v=20261106-libraryhome1" defer></script>
  <link rel="stylesheet" href="library-layouts.css?v=20261106-listgrid1">
  <script src="model.js?v=20261106-creation1" defer></script><script src="library.js?v=20261107-toolbar1" defer></script>
</head>
<body data-ops-app="sops" class="library-page">
  <a class="skip-link" href="#library">Skip To SOP Library</a>
  <header class="site-header"><a class="brand" href="/" aria-label="Operations Home"><img src="../../assets/logos/northglenn-horizontal.png" alt="City of Northglenn" width="300" height="69"></a><div class="facility"><strong>Water Treatment Facility</strong><span>SOP LIBRARY</span></div><button data-ops-menu type="button">Apps</button></header>
  <main id="library">
    <div class="library-page-heading"><div><h1>SOP Library</h1><p>Find and open your saved procedures.</p></div><div class="toolbar-actions"><a class="library-link primary" href="./editor.html?new=1">+ New SOP</a></div></div>
    <section class="filters" aria-label="Find SOPs">
      <label class="search-field">Find An SOP<input id="library-search" type="search" placeholder="Title, team, or tag"></label>
      <label class="tag-field">Filter By Tag<select id="library-tag"></select></label><label class="review-field">Review Status<select id="library-review"><option value="">All SOPs</option><option value="review">Needs Review</option><option value="current">Current</option></select></label><label class="sort-field">Sort By<select id="library-sort"><option value="title">Title A–Z</option><option value="saved">Last Saved</option><option value="title-desc">Title Z&ndash;A</option><option value="review">Needs Review First</option><option value="revised">Revised Date</option></select></label><button id="clear-library-filters" type="button">Clear Filters</button>
    </section>
    <p id="library-status" role="status" aria-live="polite">Loading SOPs…</p>
    <div class="results-bar"><div class="counts"><span id="library-count" class="count" role="status"></span><button id="review-shortcut" class="review-shortcut" type="button"></button></div><div class="view-toggle" role="group" aria-label="Library Layout"><button type="button" data-layout-choice="list" aria-pressed="true">☷ List</button><button type="button" data-layout-choice="grid" aria-pressed="false">▦ Grid</button></div></div>
    <div id="library-list" class="library" data-layout="list"></div>
  </main>
  <dialog id="delete-sop-dialog" aria-labelledby="delete-sop-heading" aria-describedby="delete-sop-description">
    <form id="delete-sop-form">
      <h2 id="delete-sop-heading">Delete SOP?</h2>
      <p id="delete-sop-description">This will remove the following SOP from the library:</p>
      <p id="delete-sop-title" class="delete-sop-title"></p>
      <label for="delete-sop-confirmation">Type DELETE to confirm<input id="delete-sop-confirmation" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
      <p id="delete-sop-error" role="alert"></p>
      <div class="confirm-actions"><button id="cancel-delete-sop" type="button">Cancel</button><button id="confirm-delete-sop" class="danger" type="submit" disabled>Delete SOP</button></div>
    </form>
  </dialog>
</body>
</html>
