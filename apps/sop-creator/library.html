<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOP Library | Northglenn Operations</title>
  <link rel="icon" href="../../assets/logos/favicon.png">
  <link rel="stylesheet" href="../../shared/operations/theme.css"><link rel="stylesheet" href="../../shared/operations/navigation.css">
  <link rel="stylesheet" href="styles.css?v=20261106-creation1">
  <script src="../../shared/operations/navigation.js?v=20261106-soplibrary1" defer></script>
  <script src="model.js?v=20261106-creation1" defer></script><script src="library.js?v=20261106-creation1" defer></script>
</head>
<body data-ops-app="sops" class="library-page">
  <a class="skip-link" href="#library">Skip To SOP Library</a>
  <header class="site-header"><a class="brand" href="/" aria-label="Operations Home"><img src="../../assets/logos/northglenn-horizontal.png" alt="City of Northglenn" width="300" height="69"></a><div class="facility"><strong>Water Treatment Facility</strong><span>SOP LIBRARY</span></div><button data-ops-menu type="button">Apps</button></header>
  <main id="library">
    <div class="library-page-heading"><div><h1>SOP Library</h1><p>Find and open your saved procedures.</p></div><div class="toolbar-actions"><a class="library-link" data-return-editor href="./">Return To Editor</a><a class="library-link primary" href="./?new=1">+ New SOP</a><button id="refresh-library" type="button">Refresh</button></div></div>
    <section class="library-search-panel" aria-label="Find SOPs">
      <label>Find An SOP<input id="library-search" type="search" placeholder="Title, team, or tag"></label>
      <div class="library-filters"><label>Filter By Tag<select id="library-tag"></select></label><label>Sort By<select id="library-sort"><option value="saved">Last Saved</option><option value="title">Title A–Z</option><option value="tags">Tags A–Z</option><option value="revised">Revised Date</option></select></label><button id="clear-library-filters" type="button">Clear Filters</button></div>
    </section>
    <p id="library-status" role="status" aria-live="polite">Loading SOPs…</p><p id="library-count" class="help" role="status"></p>
    <div id="library-list" class="library-grid"></div>
  </main>
</body>
</html>
