
services:
  water-treatment-tools:
    build: .
    image: water-treatment-tools:latest
    container_name: water-treatment-tools
    restart: unless-stopped
    ports:
      - "6767:80"   # Web interface
      - "6768:3001" # Claude proxy API
    environment:
      - TZ=America/New_York  # Adjust to your timezone
      - NODE_ENV=production
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}  # Set this in .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}  # Set this in .env file
    labels:
      - "traefik.enable=true"
      # Main web interface
      - "traefik.http.routers.water-treatment.rule=Host(`water-treatment.yourdomain.com`)"
      - "traefik.http.routers.water-treatment.tls=true"
      - "traefik.http.routers.water-treatment.tls.certresolver=letsencrypt"
      - "traefik.http.services.water-treatment.loadbalancer.server.port=80"
      # Claude API proxy endpoint
      - "traefik.http.routers.water-treatment-api.rule=Host(`water-treatment.yourdomain.com`) && PathPrefix(`/api/claude`)"
      - "traefik.http.routers.water-treatment-api.tls=true"
      - "traefik.http.routers.water-treatment-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.water-treatment-api.loadbalancer.server.port=3001"
    volumes:
      # Mount sample data for the apps
      - ./sample-data:/usr/share/nginx/html/sample-data:ro
      # Mount training videos directory from host
      - /mnt/user/appdata/water-treatment-tools/Videos:/usr/share/nginx/html/Videos:ro
      # Mount .env file if it exists (optional - environment variables take precedence)
      - ./.env:/app/.env:ro
    networks:
      - gibbhub

networks:
  gibbhub:
    name: gibbhub
    external: true
